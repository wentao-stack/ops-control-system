[unix_http_server]
file=/home/wentao/.supervisor/supervisor.sock

[supervisord]
logfile=/home/wentao/project/ops-control-system/logs/supervisord.log
pidfile=/home/wentao/.supervisor/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/wentao/.supervisor/supervisor.sock

[program:ops-control-backend]
command=/home/wentao/project/ops-control-system/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/home/wentao/project/ops-control-system/backend
user=wentao
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/home/wentao/project/ops-control-system/logs/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PATH="/home/wentao/project/ops-control-system/backend/.venv/bin:/usr/bin:/bin"

[program:ops-control-frontend]
command=npm run dev
directory=/home/wentao/project/ops-control-system/frontend
user=wentao
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/home/wentao/project/ops-control-system/logs/frontend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
