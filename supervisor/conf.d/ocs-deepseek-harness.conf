[program:ocs-deepseek-harness]
; DeepSeek Harness (dsh) Web UI — 按需启动，默认不自动启动（同 ocs-comfyui）。
; 启动: supervisorctl start ocs-deepseek-harness  → http://127.0.0.1:3080
; 注意: dsh 安全限制只允许绑定 127.0.0.1（0.0.0.0 会暴露 RCE，被工具拒绝）。
; LLM 走本地 llama-swap :9292，key 环境变量 QWEN_API_KEY（见 ~/.dsh/profiles/web/cordis.patch.yml），
; 从 gitignore 的 supervisor/env/ocs-deepseek-harness.env 注入（不进 Git）。
; 用 sh -c 包裝：set -a 自動匯出 env 檔變數（注入 QWEN_API_KEY），
; exec 讓 shell 被 node 取代（supervisor 的 TERM 直接發給 node，避免 stop 時
; node 孫進程殘留佔住端口 EADDRINUSE）。supervisor 的 envfile 指令在此環境未生效，
; 故改用 source 方式確保 key 注入。
command=/bin/sh -c 'set -a; . /home/wentao/project/ops-control-system/supervisor/env/ocs-deepseek-harness.env; set +a; exec /home/wentao/.local/bin/node --import tsx/esm apps/cli/src/bin.ts web --host 127.0.0.1 --port 3080'
directory=/home/wentao/project/deepseek-harness
autostart=false
autorestart=true
startsecs=15
startretries=3
redirect_stderr=false
stdout_logfile=/home/wentao/project/ops-control-system/supervisor/log/ocs-deepseek-harness.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/home/wentao/project/ops-control-system/supervisor/log/ocs-deepseek-harness-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
user=wentao
stopsignal=TERM
stopwaitsecs=30
environment=PATH="/home/wentao/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",NODE_ENV="production"
