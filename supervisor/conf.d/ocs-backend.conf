environment=PATH="/home/wentao/project/ops-control-system/backend/.venv/bin:/home/wentao/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
envfile=/home/wentao/project/ops-control-system/backend/.env
