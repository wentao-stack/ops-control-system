[program:ocs-backend]
command=/home/wentao/project/ops-control-system/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 18080
directory=/home/wentao/project/ops-control-system/backend
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=false
stdout_logfile=/home/wentao/project/ops-control-system/supervisor/log/ocs-backend.log
