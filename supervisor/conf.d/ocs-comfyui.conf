[program:ocs-comfyui]
; MiniMax H3 的主模型、文本编码器和视频 VAE 总量超过 24 GiB。禁用异步
; 卸载缓冲区并强制积极卸载，避免 comfy_aimdo 在工作流切换阶段发生 VRAM OOM。
command=/home/wentao/project/ComfyUI/.venv/bin/python /home/wentao/project/ComfyUI/main.py --listen 0.0.0.0 --port 8188 --disable-async-offload --disable-smart-memory
directory=/home/wentao/project/ComfyUI
autostart=false
autorestart=true
startsecs=10
startretries=3
redirect_stderr=false
stdout_logfile=/home/wentao/project/ops-control-system/supervisor/log/ocs-comfyui.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/home/wentao/project/ops-control-system/supervisor/log/ocs-comfyui-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
user=wentao
stopsignal=TERM
stopwaitsecs=30
environment=PATH="/home/wentao/project/ComfyUI/.venv/bin:/home/wentao/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1"
